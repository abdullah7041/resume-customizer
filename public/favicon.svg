<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="airoIconTitle">
  <title id="airoIconTitle">AI Resume Optimizer icon</title>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea472;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075951;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" />
  
  <!-- Document shape with fold -->
  <g filter="url(#shadow)">
    <!-- Main document body -->
    <path d="M 20 14 L 38 14 L 44 20 L 44 50 L 20 50 Z" fill="url(#docGradient)" />
    
    <!-- Page fold -->
    <path d="M 38 14 L 38 20 L 44 20 Z" fill="#e0e0e0" opacity="0.6" />
    
    <!-- Text lines -->
    <line x1="24" y1="26" x2="40" y2="26" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" />
    <line x1="24" y1="30" x2="38" y2="30" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="24" y1="34" x2="40" y2="34" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="24" y1="38" x2="36" y2="38" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="24" y1="42" x2="40" y2="42" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="24" y1="46" x2="34" y2="46" stroke="#0ea472" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>
  
  <!-- AI sparkle accent -->
  <g opacity="0.9">
    <path d="M 48 38 L 49.5 40.5 L 52 42 L 49.5 43.5 L 48 46 L 46.5 43.5 L 44 42 L 46.5 40.5 Z" fill="#f4d37d" />
    <circle cx="48" cy="42" r="1" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
