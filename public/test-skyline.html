<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Image Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-box {
            margin: 20px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .image-test {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 2px solid #4a4a4a;
            margin: 10px 0;
        }
        .direct-img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            margin: 10px 0;
        }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 Skyline Image Debug Test</h1>
        
        <div class="test-box">
            <h2>1. Direct IMG Tag</h2>
            <p>If this shows, the image loads correctly:</p>
            <img id="direct-img" class="direct-img" src="" alt="Skyline test">
            <pre id="img-status">Loading...</pre>
        </div>

        <div class="test-box">
            <h2>2. Background Image (CSS)</h2>
            <p>If this shows, CSS background-image works:</p>
            <div id="bg-test" class="image-test"></div>
            <pre id="bg-status">Setting background...</pre>
        </div>

        <div class="test-box">
            <h2>3. Image Info</h2>
            <pre id="info"></pre>
        </div>

        <div class="test-box">
            <h2>4. Network Test</h2>
            <pre id="network-test">Testing...</pre>
        </div>
    </div>

    <script>
        const imageUrl = "https://cwcjeujextkwpmzdfzdz.supabase.co/storage/v1/object/public/ui-assets/KAFDH.webp?v=1759670258167";
        
        // Test 1: Direct IMG tag
        const directImg = document.getElementById('direct-img');
        const imgStatus = document.getElementById('img-status');
        
        directImg.src = imageUrl;
        directImg.onload = () => {
            imgStatus.textContent = `✅ SUCCESS\nDimensions: ${directImg.naturalWidth}x${directImg.naturalHeight}`;
            imgStatus.style.color = '#4ade80';
        };
        directImg.onerror = (e) => {
            imgStatus.textContent = `❌ FAILED\nError: ${e.message || 'Unknown error'}`;
            imgStatus.style.color = '#f87171';
        };

        // Test 2: Background Image
        const bgTest = document.getElementById('bg-test');
        const bgStatus = document.getElementById('bg-status');
        bgTest.style.backgroundImage = `url('${imageUrl}')`;
        
        const img = new Image();
        img.onload = () => {
            bgStatus.textContent = `✅ Background set successfully\nImage dimensions: ${img.width}x${img.height}`;
            bgStatus.style.color = '#4ade80';
        };
        img.onerror = () => {
            bgStatus.textContent = '❌ Background image failed to load';
            bgStatus.style.color = '#f87171';
        };
        img.src = imageUrl;

        // Test 3: Info
        const info = document.getElementById('info');
        info.textContent = `URL: ${imageUrl}\n\nParsed:\n${JSON.stringify(new URL(imageUrl), null, 2)}`;

        // Test 4: Fetch test
        const networkTest = document.getElementById('network-test');
        fetch(imageUrl, { method: 'HEAD' })
            .then(response => {
                networkTest.textContent = `✅ Fetch successful\nStatus: ${response.status}\nContent-Type: ${response.headers.get('content-type')}\nContent-Length: ${response.headers.get('content-length')}`;
                networkTest.style.color = '#4ade80';
            })
            .catch(error => {
                networkTest.textContent = `❌ Fetch failed\nError: ${error.message}`;
                networkTest.style.color = '#f87171';
            });
    </script>
</body>
</html>
