[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These VITE_ keys are public client-side keys (safe to expose in browser)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SENTRY_DSN,VITE_MIXPANEL_TOKEN"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # External modules to avoid bundling large dependencies
  external_node_modules = ["@supabase/supabase-js", "pdfjs-dist", "axios", "@netlify/functions", "@sparticuz/chromium"]
  # Included files for shared modules (now in netlify/lib/)
  included_files = ["netlify/lib/**"]

# Individual function configurations
[functions."ai"]
  timeout = 30

[functions."ai-match"]
  timeout = 30

[functions."optimize"]
  timeout = 60  # Increased for Gemini flash model processing (target: 20-25s, buffer for edge cases)

[functions."generate-cover-letter"]
  timeout = 30

[functions."predict-questions"]
  timeout = 30

[functions."extract-resume-json"]
  timeout = 30

[functions."generate-pdf"]
  timeout = 45  # PDF generation: Target <10s, buffer for edge cases
  memory = 1024

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sentry build plugin for source maps
# Requires SENTRY_ORG, SENTRY_PROJECT, and SENTRY_AUTH_TOKEN env vars in Netlify
[[plugins]]
  package = "@sentry/netlify-build-plugin"
  
  [plugins.inputs]
    # Skip commit association (requires GitHub integration in Sentry)
    skipSetCommits = true