# Local development configuration
[dev]
  # Increase function timeout for local development to match production
  # This fixes "Task timed out" errors for slow Gemini responses
  # Also accounts for Puppeteer cold start (browser launch can take 30-60s)
  functionTimeout = 120

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These VITE_ keys are public client-side keys (safe to expose in browser)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SENTRY_DSN,VITE_MIXPANEL_TOKEN"
  # Optimize function bundling
  NODE_OPTIONS = "--max-old-space-size=4096"

# Build plugins for optimization
[[plugins]]
  package = "./netlify/plugins/optimize-build.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # External modules to avoid bundling large dependencies
  external_node_modules = [
    "@supabase/supabase-js",
    "pdfjs-dist",
    "axios",
    "@netlify/functions",
    "@sparticuz/chromium",
    "puppeteer-core",
    "resend",
    "nanoid",
    "@upstash/ratelimit",
    "@upstash/redis",
    "dotenv",
    "@sentry/node"
  ]
  # Included files for shared modules (now in netlify/lib/)
  included_files = ["netlify/lib/**"]
  # Increase function bundle size limit
  bundle_size_limit = "10mb"

# Individual function configurations
[functions."ai"]
  timeout = 30

[functions."ai-match"]
  timeout = 30

[functions."optimize"]
  timeout = 60  # Increased for Gemini flash model processing (target: 20-25s, buffer for edge cases)

[functions."generate-cover-letter"]
  timeout = 30

[functions."predict-questions"]
  timeout = 30

[functions."extract-resume-json"]
  timeout = 60  # Increased for Gemini parsing (PDF data takes 30-45s, buffer for edge cases)

[functions."generate-pdf"]
  timeout = 90  # PDF generation: Puppeteer browser launch can take 30-60s on cold start
  memory = 1024

[functions."vision2030-alignment"]
  timeout = 60  # Vision 2030 analysis: Gemini flash model with large prompt takes 30-40s

# Scheduled Functions (Cron Jobs)
[functions."cron-reset-credits"]
  timeout = 30

[functions."cron-monthly-summary"]
  timeout = 30

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control (Default for HTML)
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache Control (Long cache for hashed assets)
    Cache-Control = "public, max-age=31536000, immutable"

