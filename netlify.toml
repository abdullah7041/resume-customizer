# ============================================
# DEPLOYMENT RELIABILITY CONFIGURATION
# ============================================
# Note: Lighthouse plugin has been removed to prevent deployment timeouts.
# It was causing intermittent upload failures and adding significant build time.
# If Lighthouse audits are needed, run them separately via CI or local testing.

# Local development configuration
[dev]
  # Increase function timeout for local development to match production
  # This fixes "Task timed out" errors for slow Gemini responses
  # Also accounts for Puppeteer cold start (browser launch can take 30-60s)
  functionTimeout = 120

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These VITE_ keys are public client-side keys (safe to expose in browser)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SENTRY_DSN,VITE_MIXPANEL_TOKEN"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Externalize the heavy shared deps so esbuild does not inline them into every
  # function bundle. Cuts per-function esbuild memory drastically (was OOMing the
  # bundler in `netlify dev` on low-RAM machines). Per-function external_node_modules
  # below are CONCATENATED with this list, not overridden.
  external_node_modules = ["@sentry/node", "@supabase/supabase-js"]
  # Included files for shared modules (now in netlify/lib/)
  # Included files for shared modules (now in netlify/lib/)
  # included_files = ["netlify/lib/**"] - REMOVED: esbuild handles this, and this causes massive duplication


# Individual function configurations
[functions."ai"]
  timeout = 30

[functions."ai-match"]
  timeout = 90  # Increased: OpenRouter timeout 65s + 25s cleanup buffer

[functions."optimize"]
  timeout = 120  # Increased: OpenRouter timeout 100s + 20s cleanup buffer

[functions."optimize-stream"]
  timeout = 120  # SSE streaming variant — same AI call, same timeout

[functions."generate-cover-letter"]
  timeout = 60  # Increased: OpenRouter timeout 50s + 10s buffer

[functions."predict-questions"]
  timeout = 60  # Increased: OpenRouter timeout 50s + 10s buffer

[functions."generate-clarifications"]
  timeout = 30  # Lightweight pre-optimization gap analysis (20s AI timeout + 10s buffer)

[functions."refine-bullet"]
  timeout = 35  # Single-bullet refinement (25s AI timeout + 10s buffer)

[functions."extract-resume-json"]
  external_node_modules = ["pdfjs-dist"]
  timeout = 70  # Increased: OpenRouter timeout 50s + 20s buffer for parsing

[functions."generate-pdf"]
  external_node_modules = ["@sparticuz/chromium"]
  timeout = 90  # PDF generation: Puppeteer browser launch can take 30-60s on cold start
  memory = 1024

[functions."vision2030-alignment"]
  timeout = 70  # Increased: OpenRouter timeout 50s + 20s buffer

[functions."parse-arabic-resume"]
  timeout = 70  # Increased: OpenRouter timeout 50s + 20s buffer

# Scheduled Functions (Cron Jobs)
[functions."cron-reset-credits"]
  timeout = 30
  schedule = "0 23 * * *"

[functions."cron-monthly-summary"]
  timeout = 30
  schedule = "0 7 28 * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control (Default for HTML)
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache Control (Long cache for hashed assets)
    Cache-Control = "public, max-age=31536000, immutable"

