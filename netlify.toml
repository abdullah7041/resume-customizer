# Local development configuration
[dev]
  # Increase function timeout for local development to match production
  # This fixes "Task timed out" errors for slow Gemini responses
  # Also accounts for Puppeteer cold start (browser launch can take 30-60s)
  functionTimeout = 120

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These VITE_ keys are public client-side keys (safe to expose in browser)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SENTRY_DSN,VITE_MIXPANEL_TOKEN"
  # Optimize function bundling
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # External modules to avoid bundling large dependencies
  external_node_modules = [
    "@supabase/supabase-js",
    "pdfjs-dist",
    "axios",
    "@netlify/functions",
    "@sparticuz/chromium",
    "puppeteer-core",
    "resend",
    "nanoid",
    "@upstash/ratelimit",
    "@upstash/redis",
    "dotenv",
    "@sentry/node"
  ]
  # Included files for shared modules (now in netlify/lib/)
  included_files = ["netlify/lib/**"]

# Note: Per-function timeout/memory is NOT configurable in netlify.toml
# Function timeouts are managed by Netlify plan settings:
# - Free/Starter: 10 seconds
# - Pro: up to 26 seconds  
# - For longer tasks, use background functions (15 min timeout)
# Memory is fixed at 1024MB for all functions

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control (Default for HTML)
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache Control (Long cache for hashed assets)
    Cache-Control = "public, max-age=31536000, immutable"

