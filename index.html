<!doctype html>
<html lang="en" dir="ltr" class="min-h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const root = document.documentElement;
        const storageKey = "theme";
        const legacyKey = "airo:theme";
        
        // Check feature flag - replaced at build time by Vite
        const darkModeEnabled = "%VITE_FEATURE_DARK_MODE%" !== "false";
        
        // If dark mode is disabled, always apply light theme and skip detection
        if (!darkModeEnabled) {
          root.classList.add("light");
          root.classList.remove("dark");
          root.dataset.theme = "light";
          root.setAttribute("data-theme", "light");
          root.style.colorScheme = "light";
          return;
        }
        
        const apply = (theme) => {
          const isDark = theme === "dark";
          root.classList.toggle("dark", isDark);
          root.classList.toggle("light", !isDark);
          root.dataset.theme = theme;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
        };
        
        const read = (key) => {
          try {
            return window.localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        };
        
        const write = (key, value) => {
          try {
            window.localStorage.setItem(key, value);
          } catch (error) {
            /* ignore */
          }
        };

        let stored = read(storageKey);
        if (stored !== "dark" && stored !== "light") {
          const legacy = read(legacyKey);
          if (legacy === "dark" || legacy === "light") {
            stored = legacy;
            write(storageKey, legacy);
          } else {
            stored = null;
          }
        }

        if (!stored) {
          const prefersDark =
            typeof window !== "undefined" &&
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          stored = prefersDark ? "dark" : "light";
        }

        apply(stored);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cwcjeujextkwpmzdfzdz.supabase.co" />
    <link rel="preconnect" href="https://cwcjeujextkwpmzdfzdz.supabase.co" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Optimizer</title>
  </head>
  <body class="min-h-full antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
