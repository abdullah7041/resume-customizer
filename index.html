  <script>
    (() => {
      const root = document.documentElement;
      const storageKey = "theme";
      const legacyKey = "airo:theme";

      // Check feature flag - replaced at build time by Vite
      const darkModeEnabled = "%FEATURE_DARK_MODE%" !== "false";

      // If dark mode is disabled, always apply light theme and skip detection
      if (!darkModeEnabled) {
        root.classList.add("light");
        root.classList.remove("dark");
        root.dataset.theme = "light";
        root.setAttribute("data-theme", "light");
        root.style.colorScheme = "light";
        return;
      }

      const apply = (theme) => {
        const isDark = theme === "dark";
        root.classList.toggle("dark", isDark);
        root.classList.toggle("light", !isDark);
        root.dataset.theme = theme;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
      };

      const read = (key) => {
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      };

      const write = (key, value) => {
        try {
          window.localStorage.setItem(key, value);
        } catch (error) {
          /* ignore */
        }
      };

      let stored = read(storageKey);
      if (stored !== "dark" && stored !== "light") {
        const legacy = read(legacyKey);
        if (legacy === "dark" || legacy === "light") {
          stored = legacy;
          write(storageKey, legacy);
        } else {
          stored = null;
        }
      }

      if (!stored) {
        const prefersDark =
          typeof window !== "undefined" &&
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        stored = prefersDark ? "dark" : "light";
      }

      apply(stored);
    })();
  </script>
